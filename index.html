<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spend Tracker</title>
  <meta name="description" content="Personal spending tracker. Your data stays on this device.">
  <meta name="theme-color" content="#121211">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spends">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" aria-live="polite"><div class="boot">Loading…</div></main>
  <div id="sheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>Spend Tracker needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
